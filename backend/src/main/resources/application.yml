spring:
  application:
    name: budget-tracker-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/budgetdb}
    username: ${DB_USERNAME:budgetuser}
    password: ${DB_PASSWORD:budgetpass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080
  servlet:
    context-path: /

jwt:
  secret: ${JWT_SECRET:myVerySecretKeyThatIsAtLeast256BitsLongForHmacSha256Algorithm!!}
  expiration-ms: 86400000

logging:
  level:
    com.sanele.budgettracker: DEBUG
    org.springframework.security: WARN
