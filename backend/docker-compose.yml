services:
  api:
    build: .
    container_name: budget-api
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: myVerySecretKeyThatIsAtLeast256BitsLongForHmacSha256Algorithm!!
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: budgetdb
    ports:
    - 8080:8080
    restart: unless-stopped
    networks:
    - portfolio-net
networks:
  portfolio-net:
    external: true
