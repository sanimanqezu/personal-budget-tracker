services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: budget-backend
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: myVerySecretKeyThatIsAtLeast256BitsLongForHmacSha256Algorithm!!
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: budgetdb
    ports:
    - 8080:8080
    restart: unless-stopped
    networks:
    - budget-net
    - portfolio-net
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: budget-frontend
    depends_on:
    - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: change-this-secret-in-production
    ports:
    - 3000:3000
    restart: unless-stopped
    networks:
    - budget-net
    - portfolio-net
networks:
  budget-net:
    driver: bridge
  portfolio-net:
    external: true
